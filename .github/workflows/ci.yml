name: "Core CI"

# Ядро диалога РОББОКСа (ADR-0167). Перенесено из rob_box_project «G: Dialog Core Package» (ADR-0167 Ш2).
#
# Ставит ядро в ЧИСТЫЙ venv (ни ROS, ни src/ в sys.path) на трёх версиях Python и гоняет:
#   * тесты пакетов ядра против поставленного пакета;
#   * tests/unit/dialog (сухой стенд и консоль: фейковая LLM за настоящим мостом команд) и dry_marathon.py --list;
#   * тесты гардов (scripts/lint) и сами гарды (scripts/ci/core_guards.sh).
# 3.10 - Python робота (ROS Humble), 3.11/3.12 - колонка и консоль на Windows.
#
# Чекаут робота (публичный krikz/rob_box_project@develop, ветка - ROBOT_REF): часть тестов ядра сверяет ядро с файлами
# робота (профиль робота docker/sound/config, сообщения rob_box_dialog_msgs, сценарии марафона .github/e2e и вердикт шага
# scripts/ci/e2e/e2e_tool_match.py, хосты rob_box_voice/rob_box_supervisor). До ADR-0167 Ш3/Ш5 эти сверки живут здесь:
# файлы робота накладываются на рабочую копию, НЕ затирая ни одного файла ядра (rsync --ignore-existing и исключения).

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      robot_ref:
        description: "Ветка/тег krikz/rob_box_project для сверок с роботом"
        default: develop

permissions:
  contents: read

env:
  ROBOT_REF: ${{ inputs.robot_ref || 'develop' }}

jobs:
  core:
    name: Core (Python ${{ matrix.python }})
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12']
    env:
      VENV: ${{ github.workspace }}/../core-venv
      ROB_BOX_CORE_FROM_PACKAGE: '1'
      PYTHONUTF8: '1'

    steps:
      - name: Checkout core
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install core package into a clean venv
        run: |
          python -m venv "$VENV"
          "$VENV/bin/python" -m pip install --upgrade pip
          "$VENV/bin/python" -m pip install ".[test]"
          "$VENV/bin/python" -m pip check
          "$VENV/bin/python" -m pip show -f rob-box-dialog-core | head -20
          # ROS в окружении нет: импорт rclpy обязан упасть
          if "$VENV/bin/python" -I -c "import rclpy" 2>/dev/null; then echo "rclpy нашёлся в чистом venv"; exit 1; fi

      - name: Robot checkout for cross-checks
        uses: actions/checkout@v7
        with:
          repository: krikz/rob_box_project
          ref: ${{ env.ROBOT_REF }}
          path: _robot
          fetch-depth: 1

      - name: Overlay robot files (core files are never overwritten)
        run: bash scripts/ci/robot_overlay.sh _robot

      - name: Core tests from the installed package
        run: |
          set -o pipefail
          for pkg in rob_box_dialog rob_box_dialog_host rob_box_core rob_box_llm; do
            echo "::group::$pkg"
            # тестовые каталоги без __init__.py: в sys.path попадает только test/, ядро - из venv
            ( cd "src/$pkg" && "$VENV/bin/pytest" -v -p no:cacheprovider test )
            echo "::endgroup::"
          done
          echo "::group::rob_box_harness"
          # у harness test/ - пакет: importlib-режим, чтобы pytest не положил src/rob_box_harness в sys.path.
          ( cd src/rob_box_harness && "$VENV/bin/pytest" -v -p no:cacheprovider --import-mode=importlib \
              -o asyncio_mode=auto test )
          echo "::endgroup::"

      - name: Dry stand and console from the installed package
        run: |
          "$VENV/bin/python" - <<'EOF'
          import sys
          sys.path.insert(0, "scripts/dialog")
          import dry_stand, rob_box_dialog, rob_box_dialog_host.dialog_v2_ports as ports
          assert dry_stand.core_installed()
          for m in (rob_box_dialog, ports):
              assert "/src/" not in m.__file__, m.__file__
              print(m.__name__, "->", m.__file__)
          EOF
          "$VENV/bin/pytest" -v -p no:cacheprovider tests/unit/dialog
          "$VENV/bin/python" scripts/dialog/dry_marathon.py --acts 1 --list

      - name: Guard tests
        run: |
          "$VENV/bin/pytest" -v -p no:cacheprovider scripts/lint

  guards:
    name: Core guards
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Checkout core
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Guard deps
        run: python -m pip install PyYAML

      - name: CC budget, class budget, TEMP(ADR-0148)
        run: bash scripts/ci/core_guards.sh

      - name: Robot checkout for the seam guard
        uses: actions/checkout@v7
        with:
          repository: krikz/rob_box_project
          ref: ${{ env.ROBOT_REF }}
          path: _robot
          fetch-depth: 1

      - name: Seam without consumer (core + robot tree)
        run: |
          bash scripts/ci/robot_overlay.sh _robot
          python scripts/lint/seam_without_consumer.py
