# Ядро диалога РОББОКСа одним пакетом без ROS (ADR-0160 §8 К1, ADR-0167).
#
# Репозиторий krikz/rob_box_dialog_core вынесен из krikz/rob_box_project с историей (ADR-0167 Ш2, git filter-repo).
# Исходники лежат там же, где в репо робота: src/<пакет>/<пакет>; этот файл - единственное описание сборки.
# (package.xml / setup.py в src/<пакет>/ - остаток colcon робота, пока робот не ставит ядро из тега - ADR-0167 Ш3.)
#
#   pip install "rob-box-dialog-core @ git+https://github.com/krikz/rob_box_dialog_core@vX.Y.Z"
#   pip install .            # из чекаута
#
# Состав:
#   * целиком: rob_box_core, rob_box_llm (провайдеры LLM, STT и TTS: stt_providers/minimax, providers/minimax_tts),
#     rob_box_harness, rob_box_dialog, rob_box_dialog_host (связка хода: мост команд, порты диалога, память, каталог
#     голосов, состояние музыки, разбор команд движения, фразы медиа - ADR-0167 Ш1г) и rob_box_music (чистая модель
#     музыки: её знание читают фразы медиа);
#   * из rob_box_mcp_tools - base, owner_event, voice_request, tool_outcome (строка исхода тула, #5092) и нейтральные тулы tools.web_search (поиск колонки,
#     ADR-0167 Ш3), tools.system (время/громкость/скорость/высота голоса) и tools.memory (память о людях) — поштучно
#     (py-modules), без mcp_server/core/engine робота; системные тулы стенда (сухой стенд, консоль rbx-chat) идут
#     из пакета, а не из src/ робота (граница ADR-0167 §2.1).
# Пакет rob_box_mcp_tools здесь НЕПОЛНЫЙ: ставить это ядро в одно окружение с полным ROS-пакетом робота нельзя.
# Список модулей сверяет тест src/rob_box_dialog/test/test_core_package_4245.py: каждый - без ROS на верхнем уровне.
# Консоль стенда - entry point rbx-chat (rbx_console.py, из чекаута: скрипты стенда в пакет НЕ входят).

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rob-box-dialog-core"
# 0.2.0: профиль продукта format 2 (persona), промпт Личности - основа ядра с персоной профиля (ADR-0167 Ш1б-3).
# 0.3.0: белый список пресетов стиля моста (bridge_protocol.VOICE_PRESET_IDS / VOICE_LANGUAGES) - только из каталога
#        продукта (env ROB_BOX_VOICE_PRESETS_YAML), без него пусто; запасного списка робота в ядре нет (ADR-0167 Ш1а-2).
# 0.4.0: профиль format 3 (operator_persona); промпты чата Telegram и агента-оператора - основы ядра (ADR-0167 Ш1б-4).
# 0.5.0: профиль format 4 (owners): набор тулов модели - по владельцам продукта (rob_box_dialog.owners), без профиля -
#        ни одного тула продукта; harness: load_system_prompt и AgentSpec.prompt_dir/system_prompt_file удалены (Ш1в).
# 0.6.0: связка хода - пакет rob_box_dialog_host (ADR-0167 Ш1г-1); старые пути rob_box_voice - псевдонимы.
# 0.7.0: старые пути rob_box_voice.core.* удалены, ядро без rob_box_voice (ADR-0167 Ш1г-2).
# 0.7.2: Ш3 — провайдер STT MiniMax (rob_box_llm.stt_providers.minimax_provider), нейтральные тулы
#        rob_box_mcp_tools.tools.{web_search,system,memory}, консоль-скрипт rbx-chat (добавка модулей, порт не сломан → patch).
# 0.7.3: гипотезы STT (уверенность/альтернативы) — rob_box_core.stt_hypotheses, поля Utterance.confidence/alternatives
#        (зеркало rob_box_dialog_msgs), чтение в address.heard_from/backlog.Heard (порт #4645 монорепо, порт не сломан → patch).
# 0.7.4: сжатый ответ тула — обычный dict в recent_actions; mappingproxy не падает на JSON следующего хода (#4688).
# 0.7.5: sync монорепо #4671/#4672/#4673/#4679/#4680/#4691 — photo_send, чужое имя лица при фото, пропуск
#        повторных чисел (_unsaid_count_prefix), rejected reason, answer_performance, сид материала со стилем.
# 0.7.6: n903 — исправление remap ambulance → police_lights для сирены/мигалки (#4694).
# 0.7.7: n311 «мол/дескать, тишина» не считается stop-claim'ом + n908 память как условие просьбы (#4694).
# 0.7.8: n810 rap с backing=beat накладывается на играющую музыку + n1009 сброс памяти говорившего после reset (#4733/#4734).
# 0.7.9: тег v0.7.9 вышел со строкой 0.7.8 — номер в файле отстал от тега, так больше не делаем.
# 0.7.10: get_robot_status говорит «поза симулятора» кодом (message), каталог цитирует то же описание; комментарии хоста — dialog_node.
# 0.7.11: search(..., browse_when_empty=True) отдаёт каталог фактов, когда подстрока и реплики пусты (#4956, порт из монорепо).
# 0.7.12: тег вышел со строкой 0.7.11 — паспорт пакета врал (pip show / importlib.metadata). Код тега не меняем.
# 0.7.13: version догнала тег; гард scripts/lint/check_version_tag.py не пускает тег vX.Y.Z мимо строки version.
# 0.7.14: порт фиксов диалога (порт не сломан, patch): #5006 media.timeout_pending, #5007 DONE_CLAIMS["speed"],
#         n211 unless_after, #4984 шаг тона после чужого слова, имя одиночного провайдера.
# 0.7.15: тег вышел со строкой 0.7.14 — паспорт отстал от тега (код тега не меняем).
# 0.7.16: SessionSnapshot.session_generation +1 на reset, replace_epoch не трогает (ADR-0175 §1.2, #5059).
# 0.7.21: парсер лога режет ход v2 по агрегату 📊 [turn] (порт из монорепо d0c4395d8, #5074); v1 не сломан.
# 0.7.22: порт диалога из монорепо — ответ о каталоге звуков вместо общей фразы (#5104).
# 0.7.23: порт диалога из монорепо — просьба «тишина» не долг слов (#5105).
# 0.7.25: паспорт догнал тег v0.7.24 — код тега не менялся (#5127).
# 0.7.26: просьба говорить толкает за словами и без запроса (#5094).
# 0.7.27: диктовку факта сохраняет код (#5128); подтверждение memory_save — фраза из факта результата, не речь модели (#5166). Тег ставит координатор.
# 0.7.28: описание chimera_perform строится из enum схемы, не второй копией строки (#5152, порт из монорепо a23fffefb). Порт не сломан → patch.
# 0.7.29: «запомнил» без memory_save не проходит, фраза — из факта результата (#5166, #5128, порт из монорепо 920793e42). Порт не сломан → patch.
# 0.7.30: порт из зеркала монорепо — оговорка STT «сериал» (#5020), «расскажи и покажи» (#5187), Химера скажи/сыграй (#5025). Тег ставит координатор.
# 0.7.31: порт из зеркала монорепо — ключ REASON_WORDS no_lyrics_path (#4973). Тег ставит координатор.
# 0.7.32: порт из монорепо — после отказа memory_save речь модели о записи не звучит (#5215); строка о шуме STT снята из промпта (#4127). Тег ставит координатор.
# 0.7.33: порт из монорепо — «Голос твой запоминаю» при отказе register_speaker не звучит (#5221). Тег ставит координатор.
# 0.7.34: порт из монорепо — фраза успеха register_speaker без записанного имени не строится: «Запомнил тебя, None.» не звучит (#5235). Тег ставит координатор.
# 0.7.35: счёт с формой («шаг») — не то же выступление, что голый счёт с теми же числами (#4342). Тег ставит координатор.
version = "0.7.35"
description = "Ядро диалога РОББОКСа без ROS: ход, адресация, мост команд LLM, память (ADR-0150, ADR-0160 §8)"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "openai>=1.0",
    "httpx>=0.27",
]

[project.scripts]
# Консоль стенда хода v2 (scripts/dialogue/chat.py, ADR-0167 Ш3): rbx-chat вместо python scripts/dialogue/chat.py.
rbx-chat = "rbx_console:main"

[project.optional-dependencies]
test = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "respx>=0.21",
    "faker>=18.0",
    # respx не понимает httpx 2 (https://github.com/lundberg/respx/pull/317) — как в rob_box_llm[dev]
    "openai>=1.0,<3.0",
]

[tool.setuptools]
zip-safe = false
py-modules = [
    "rbx_console",
    "rob_box_mcp_tools.owner_event",
    "rob_box_mcp_tools.voice_request",
    "rob_box_mcp_tools.base",
    "rob_box_mcp_tools.tool_outcome",
    "rob_box_mcp_tools.tools.web_search",
    "rob_box_mcp_tools.tools.system",
    "rob_box_mcp_tools.tools.memory",
]

[tool.setuptools.packages.find]
where = [
    "src/rob_box_core",
    "src/rob_box_llm",
    "src/rob_box_harness",
    "src/rob_box_dialog",
    "src/rob_box_dialog_host",
    "src/rob_box_music",
]
include = ["rob_box_core*", "rob_box_llm*", "rob_box_harness*", "rob_box_dialog*", "rob_box_music*"]  # dialog* - и _host
exclude = ["*.test", "*.test.*"]

[tool.setuptools.package-dir]
rob_box_mcp_tools = "src/rob_box_mcp_tools/rob_box_mcp_tools"

[tool.setuptools.package-data]
"rob_box_dialog.phrases" = ["*.yaml"]
"rob_box_dialog.prompts" = ["*.txt"]
"rob_box_harness.core.data" = ["*.yaml"]
"rob_box_core" = ["py.typed", "dialog_msgs/*.msg"]
"rob_box_core.migrations" = ["*.sql"]
"rob_box_music" = ["data/*.json"]

