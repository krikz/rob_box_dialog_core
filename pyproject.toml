# Ядро диалога РОББОКСа одним пакетом без ROS (ADR-0160 §8 К1, ADR-0167).
#
# Репозиторий krikz/rob_box_dialog_core вынесен из krikz/rob_box_project с историей (ADR-0167 Ш2, git filter-repo).
# Исходники лежат там же, где в репо робота: src/<пакет>/<пакет>; этот файл - единственное описание сборки.
# (package.xml / setup.py в src/<пакет>/ - остаток colcon робота, пока робот не ставит ядро из тега - ADR-0167 Ш3.)
#
#   pip install "rob-box-dialog-core @ git+https://github.com/krikz/rob_box_dialog_core@vX.Y.Z"
#   pip install .            # из чекаута
#
# Состав:
#   * целиком: rob_box_core, rob_box_llm (провайдеры LLM, STT и TTS: stt_providers/minimax, providers/minimax_tts),
#     rob_box_harness, rob_box_dialog, rob_box_dialog_host (связка хода: мост команд, порты диалога, память, каталог
#     голосов, состояние музыки, разбор команд движения, фразы медиа - ADR-0167 Ш1г) и rob_box_music (чистая модель
#     музыки: её знание читают фразы медиа);
#   * из rob_box_mcp_tools - base, owner_event, voice_request и нейтральные тулы tools.web_search (поиск колонки,
#     ADR-0167 Ш3), tools.system (время/громкость/скорость/высота голоса) и tools.memory (память о людях) — поштучно
#     (py-modules), без mcp_server/core/engine робота; системные тулы стенда (сухой стенд, консоль rbx-chat) идут
#     из пакета, а не из src/ робота (граница ADR-0167 §2.1).
# Пакет rob_box_mcp_tools здесь НЕПОЛНЫЙ: ставить это ядро в одно окружение с полным ROS-пакетом робота нельзя.
# Список модулей сверяет тест src/rob_box_dialog/test/test_core_package_4245.py: каждый - без ROS на верхнем уровне.
# Консоль стенда - entry point rbx-chat (rbx_console.py, из чекаута: скрипты стенда в пакет НЕ входят).

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rob-box-dialog-core"
# 0.2.0: профиль продукта format 2 (persona), промпт Личности - основа ядра с персоной профиля (ADR-0167 Ш1б-3).
# 0.3.0: белый список пресетов стиля моста (bridge_protocol.VOICE_PRESET_IDS / VOICE_LANGUAGES) - только из каталога
#        продукта (env ROB_BOX_VOICE_PRESETS_YAML), без него пусто; запасного списка робота в ядре нет (ADR-0167 Ш1а-2).
# 0.4.0: профиль format 3 (operator_persona); промпты чата Telegram и агента-оператора - основы ядра (ADR-0167 Ш1б-4).
# 0.5.0: профиль format 4 (owners): набор тулов модели - по владельцам продукта (rob_box_dialog.owners), без профиля -
#        ни одного тула продукта; harness: load_system_prompt и AgentSpec.prompt_dir/system_prompt_file удалены (Ш1в).
# 0.6.0: связка хода - пакет rob_box_dialog_host (ADR-0167 Ш1г-1); старые пути rob_box_voice - псевдонимы.
# 0.7.0: старые пути rob_box_voice.core.* удалены, ядро без rob_box_voice (ADR-0167 Ш1г-2).
# 0.7.2: Ш3 — провайдер STT MiniMax (rob_box_llm.stt_providers.minimax_provider), нейтральные тулы
#        rob_box_mcp_tools.tools.{web_search,system,memory}, консоль-скрипт rbx-chat (добавка модулей, порт не сломан → patch).
version = "0.7.2"
description = "Ядро диалога РОББОКСа без ROS: ход, адресация, мост команд LLM, память (ADR-0150, ADR-0160 §8)"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "openai>=1.0",
    "httpx>=0.27",
]

[project.scripts]
# Консоль стенда хода v2 (scripts/dialogue/chat.py, ADR-0167 Ш3): rbx-chat вместо python scripts/dialogue/chat.py.
rbx-chat = "rbx_console:main"

[project.optional-dependencies]
test = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "respx>=0.21",
    "faker>=18.0",
    # respx не понимает httpx 2 (https://github.com/lundberg/respx/pull/317) — как в rob_box_llm[dev]
    "openai>=1.0,<3.0",
]

[tool.setuptools]
zip-safe = false
py-modules = [
    "rbx_console",
    "rob_box_mcp_tools.owner_event",
    "rob_box_mcp_tools.voice_request",
    "rob_box_mcp_tools.base",
    "rob_box_mcp_tools.tools.web_search",
    "rob_box_mcp_tools.tools.system",
    "rob_box_mcp_tools.tools.memory",
]

[tool.setuptools.packages.find]
where = [
    "src/rob_box_core",
    "src/rob_box_llm",
    "src/rob_box_harness",
    "src/rob_box_dialog",
    "src/rob_box_dialog_host",
    "src/rob_box_music",
]
include = ["rob_box_core*", "rob_box_llm*", "rob_box_harness*", "rob_box_dialog*", "rob_box_music*"]  # dialog* - и _host
exclude = ["*.test", "*.test.*"]

[tool.setuptools.package-dir]
rob_box_mcp_tools = "src/rob_box_mcp_tools/rob_box_mcp_tools"

[tool.setuptools.package-data]
"rob_box_dialog.phrases" = ["*.yaml"]
"rob_box_dialog.prompts" = ["*.txt"]
"rob_box_harness.core.data" = ["*.yaml"]
"rob_box_core" = ["py.typed", "dialog_msgs/*.msg"]
"rob_box_core.migrations" = ["*.sql"]
"rob_box_music" = ["data/*.json"]

