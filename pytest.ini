# Прогоны из корня (tests/unit/dialog, scripts/lint). Тесты пакетов гоняются из src/<пакет> своими pytest.ini.
[pytest]
asyncio_mode = auto
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers --tb=short
markers =
    unit: fast unit tests (no I/O, no network, no hardware)
    harness: tests for the harness framework itself
    integration: integration tests requiring live network or hardware
    network: tests that need real network access (MiniMax, etc.)
    slow: tests taking >1 second
    asyncio: async test (auto-applied when pytest-asyncio plugin is installed)
filterwarnings =
    ignore::DeprecationWarning:pytest_asyncio\..*
    ignore::DeprecationWarning:asyncio\..*
